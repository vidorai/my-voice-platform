<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King AI & Freelance Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex flex-col justify-between">
    <nav class="flex justify-between items-center p-6 max-w-6xl mx-auto w-full">
        <div class="text-2xl font-bold tracking-tight text-indigo-400">King AI Suite</div>
        <div class="space-x-4">
            <button onclick="switchTab('login')" class="text-sm font-medium hover:text-indigo-400 transition">Login</button>
            <button onclick="switchTab('register')" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm font-medium transition">Get Started</button>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-6 w-full my-auto">
        <div id="authContainer" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
            <!-- Dynamic Form Content -->
            <div id="formTitle" class="text-2xl font-bold mb-6 text-center">Welcome Back</div>
            
            <div id="channelSelector" class="grid grid-cols-2 gap-3 mb-6">
                <button type="button" onclick="setRole('client')" id="btnClient" class="p-3 bg-indigo-600 rounded-xl text-sm font-semibold transition">Client</button>
                <button type="button" onclick="setRole('freelancer')" id="btnFreelancer" class="p-3 bg-slate-800 text-gray-400 rounded-xl text-sm font-semibold transition">Freelancer</button>
            </div>

            <form onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Email Address</label>
                    <input type="email" required class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500" placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
                    <input type="password" required class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-semibold text-sm transition shadow-lg shadow-indigo-600/20 mt-2">Continue</button>
            </form>
        </div>
    </main>

    <footer class="text-center p-6 text-xs text-gray-500">
        &copy; 2026 King AI & Freelance Suite. All rights reserved.
    </footer>

    <script>
        let currentRole = 'client';
        let isRegister = false;

        function setRole(role) {
            currentRole = role;
            const btnC = document.getElementById('btnClient');
            const btnF = document.getElementById('btnFreelancer');
            if(role === 'client') {
                btnC.className = "p-3 bg-indigo-600 rounded-xl text-sm font-semibold transition";
                btnF.className = "p-3 bg-slate-800 text-gray-400 rounded-xl text-sm font-semibold transition";
            } else {
                btnF.className = "p-3 bg-indigo-600 rounded-xl text-sm font-semibold transition";
                btnC.className = "p-3 bg-slate-800 text-gray-400 rounded-xl text-sm font-semibold transition";
            }
        }

        function switchTab(tab) {
            isRegister = (tab === 'register');
            document.getElementById('formTitle').innerText = isRegister ? 'Create Your Account' : 'Welcome Back';
        }

        function handleAuth(e) {
            e.preventDefault();
            alert('Simulated ' + (isRegister ? 'Registration' : 'Login') + ' successful for ' + currentRole + ' channel!');
        }
    </script>
</body>
</html>
