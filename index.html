<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King AI & Freelance Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex flex-col justify-between">
    <!-- Top Navbar -->
    <nav class="flex justify-between items-center px-8 py-5 max-w-7xl mx-auto w-full border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="flex items-center space-x-8">
            <div class="text-2xl font-bold tracking-tight text-emerald-400">KingAI<span class="text-white">.Market</span></div>
        </div>
        <div class="space-x-3 flex items-center">
            <button onclick="openModal('login')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-600/20 cursor-pointer">Login</button>
            <button onclick="openModal('signup')" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-5 py-2.5 rounded-xl text-xs font-extrabold transition shadow-lg shadow-emerald-500/20 cursor-pointer">Sign Up</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="py-24 px-6 text-center max-w-4xl mx-auto space-y-6">
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight">Our freelancers will take it from here</h1>
        <p class="text-gray-400 text-sm max-w-xl mx-auto">Access top-tier verified talent, secure escrow protection, and integrated multi-currency payouts.</p>
        <div class="flex max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-2 shadow-2xl">
            <input type="text" id="searchInput" placeholder="Search for services (e.g., Website Development)..." class="w-full bg-transparent px-4 py-3 text-xs focus:outline-none text-white">
            <button onclick="executeSearch()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 px-6 py-3 rounded-xl font-bold text-xs transition cursor-pointer">Search</button>
        </div>
        <div id="searchFeedback" class="text-xs text-emerald-400 font-semibold h-4"></div>
    </header>

    <!-- Authentication Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full space-y-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl font-bold cursor-pointer">&times;</button>
            <div id="modalTitle" class="text-2xl font-bold text-emerald-400">Welcome Back</div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400">Email Address</label>
                    <input type="email" id="modalEmail" placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs mt-1 focus:outline-none focus:border-emerald-500 text-white">
                </div>
                <div>
                    <label class="text-xs text-gray-400">Password</label>
                    <input type="password" id="modalPassword" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs mt-1 focus:outline-none focus:border-emerald-500 text-white">
                </div>
                <button onclick="submitAuth()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold text-xs transition shadow-lg shadow-indigo-600/20 cursor-pointer" id="modalSubmitBtn">Login</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 px-6 text-center text-xs text-gray-500">
        &copy; 2026 King AI & Freelance Marketplace. All rights reserved.
    </footer>

    <!-- Script -->
    <script>
        let currentAuthMode = 'login';

        function openModal(mode) {
            currentAuthMode = mode;
            const modal = document.getElementById('authModal');
            const title = document.getElementById('modalTitle');
            const btn = document.getElementById('modalSubmitBtn');
            if (mode === 'login') {
                title.textContent = 'Welcome Back';
                btn.textContent = 'Login';
                btn.className = 'w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-bold text-xs transition shadow-lg shadow-indigo-600/20 cursor-pointer';
            } else {
                title.textContent = 'Create Account';
                btn.textContent = 'Sign Up';
                btn.className = 'w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 py-3 rounded-xl font-bold text-xs transition shadow-lg shadow-emerald-500/20 cursor-pointer';
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('authModal').classList.add('hidden');
        }

        function submitAuth() {
            const email = document.getElementById('modalEmail').value;
            if (!email) {
                alert('Please enter your email.');
                return;
            }
            alert(currentAuthMode === 'login' ? 'Logged in successfully!' : 'Account created successfully!');
            closeModal();
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value;
            const feedback = document.getElementById('searchFeedback');
            if (!query) {
                feedback.textContent = 'Please enter a search keyword.';
                return;
            }
            feedback.textContent = `Searching marketplace for "${query}"...`;
            setTimeout(() => {
                feedback.textContent = `Found top verified experts for "${query}".`;
            }, 800);
        }
    </script>
</body>
</html>
