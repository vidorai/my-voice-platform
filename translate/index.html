<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Translation - Kailancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex flex-col justify-between">
    <nav class="flex justify-between items-center p-6 border-b border-gray-800">
        <a href="/" class="text-xl font-bold tracking-wider text-green-400">KAILANCER</a>
        <a href="/" class="text-sm text-gray-400 hover:text-white">&larr; Back to Home</a>
    </nav>
    <main class="max-w-2xl mx-auto p-6 w-full flex-grow">
        <h1 class="text-3xl font-bold mb-2">AI Translation Workspace</h1>
        <p class="text-gray-400 mb-6">Translate your project descriptions, documents, or chats instantly using AI.</p>
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-xl space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Text to Translate</label>
                <textarea id="sourceText" rows="4" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-green-500" placeholder="Enter text here..."></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Target Language</label>
                <select id="targetLang" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-green-500">
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="zh">Chinese</option>
                    <option value="ur">Urdu</option>
                </select>
            </div>
            <button onclick="simulateTranslation()" class="w-full bg-green-500 hover:bg-green-600 text-black font-semibold py-3 rounded-lg transition">
                Translate with AI
            </button>
            <div class="mt-4">
                <label class="block text-sm font-medium text-gray-300 mb-2">Result</label>
                <div id="resultBox" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-gray-300 min-h-[100px]">Translation will appear here...</div>
            </div>
        </div>
    </main>
    <script>
        function simulateTranslation() {
            const text = document.getElementById('sourceText').value;
            const lang = document.getElementById('targetLang').value;
            const resultBox = document.getElementById('resultBox');
            if (!text.trim()) {
                resultBox.innerText = "Please enter some text first!";
                return;
            }
            resultBox.innerText = "Translating with AI...";
            setTimeout(() => {
                resultBox.innerText = "[Mock AI Translation (" + lang.toUpperCase() + ")]: " + text + " (Translated successfully!)";
            }, 1000);
        }
    </script>
</body>
</html>
